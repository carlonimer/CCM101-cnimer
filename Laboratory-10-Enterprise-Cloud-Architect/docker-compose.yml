version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Database Tier (MySQL 8.0)
  # Isolated within private Docker bridge network; no host port binding.
  # ----------------------------------------------------------------------------
  database:
    image: mysql:8.0
    container_name: cloudnova-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: CloudNovaRootSecure2026!
      MYSQL_DATABASE: cloudnova_wp
      MYSQL_USER: cloudnova_user
      MYSQL_PASSWORD: CloudNovaUserSecret2026!
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - cloudnova-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pCloudNovaRootSecure2026!"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M

  # ----------------------------------------------------------------------------
  # Web Tier (WordPress with Apache)
  # Exposes HTTP on Port 80, relies on healthy database connection.
  # ----------------------------------------------------------------------------
  web:
    image: wordpress:6.5-apache
    container_name: cloudnova-web
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: cloudnova_wp
      WORDPRESS_DB_USER: cloudnova_user
      WORDPRESS_DB_PASSWORD: CloudNovaUserSecret2026!
      WORDPRESS_TABLE_PREFIX: wp_
    volumes:
      - wp_data:/var/www/html
    networks:
      - cloudnova-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# Ensures database and website assets survive reboots and container upgrades.
# ------------------------------------------------------------------------------
volumes:
  db_data:
    name: cloudnova_db_data
    driver: local
  wp_data:
    name: cloudnova_wp_data
    driver: local

# ------------------------------------------------------------------------------
# Isolated Internal Network
# ------------------------------------------------------------------------------
networks:
  cloudnova-net:
    name: cloudnova-network
    driver: bridge
